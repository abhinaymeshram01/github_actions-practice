name: Auto-linter

on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v7

      # this step will install the linting tool.
      - name: Install Linter
        run: pip install ruff
        
      # this step will run the linter
      - name: check the file for linting
        run: ruff check .
